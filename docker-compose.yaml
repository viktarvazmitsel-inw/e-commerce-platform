services:

  frontend:
    container_name: shop-frontend
    build:
      context: ./infrastructure/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  broker:
    image: rabbitmq:4.3.5-alpine
    container_name: shop-broker
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-back:
    container_name: shop-auth-back
    build:
      context: ./services/auth
      dockerfile: ../../infrastructure/auth/Dockerfile
    volumes:
      - ./services/auth:/app
    ports:
      - "8080:8080"

  auth-db:
    container_name: shop-auth-db
    image: postgres:18.6-alpine
    volumes:
      - auth-db-data:/var/lib/postgresql/18/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-default}
      POSTGRES_DB: shop_auth_db



volumes:
  auth-db-data: